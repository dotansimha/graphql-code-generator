name: dependabot-lockfile
on:
  pull_request:
    branches:
      - master
    paths:
      - '**/package.json'

permissions: {}

jobs:
  # Dependabot jobs that run from a workspace member directory (e.g. /dev-test/*, /examples/*)
  # update that package.json but not the root pnpm-lock.yaml. Regenerate it and push it back.
  update-lockfile:
    name: Update pnpm-lock.yaml
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # allows pushing the lockfile to the Dependabot branch
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
      - name: Update lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit and push
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is up to date"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(deps): update pnpm-lock.yaml'
          # Other workflows (e.g. changesets-dependencies) may push to the same branch
          git pull --rebase origin "$HEAD_REF"
          git push origin "HEAD:$HEAD_REF"
